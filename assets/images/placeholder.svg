<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <pattern id="batik-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none"/>
      <!-- Diagonal lines (batik-inspired) -->
      <line x1="0" y1="60" x2="60" y2="0" stroke="#C9A22710" stroke-width="0.8"/>
      <line x1="-30" y1="60" x2="30" y2="0" stroke="#C9A22710" stroke-width="0.8"/>
      <line x1="30" y1="60" x2="90" y2="0" stroke="#C9A22710" stroke-width="0.8"/>
      <!-- Diamond center -->
      <path d="M30,12 L48,30 L30,48 L12,30 Z" fill="none" stroke="#C9A22708" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="ambient" cx="50%" cy="60%" r="60%">
      <stop offset="0%"  stop-color="#1a130a"/>
      <stop offset="100%" stop-color="#070707"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#ambient)"/>

  <!-- Batik-inspired pattern overlay -->
  <rect width="900" height="1200" fill="url(#batik-grid)"/>

  <!-- Central divider line -->
  <line x1="450" y1="480" x2="450" y2="540" stroke="#C9A227" stroke-width="0.8" opacity="0.4"/>

  <!-- Monogram block -->
  <rect x="370" y="540" width="160" height="1" fill="#C9A227" opacity="0.25"/>

  <!-- Label text -->
  <text
    x="450" y="530"
    font-family="Georgia, serif"
    font-size="13"
    fill="#A7A097"
    text-anchor="middle"
    letter-spacing="4"
    opacity="0.5"
  >BATIK PARABOS</text>

  <text
    x="450" y="565"
    font-family="Georgia, serif"
    font-size="9"
    fill="#A7A097"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.3"
  >DIGITAL ATELIER</text>
</svg>
