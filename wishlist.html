<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wishlist — Batik Parabos</title>
  <meta name="description" content="Pieces you've chosen to keep close.">

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Foundation CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Page-specific CSS -->
  <link rel="stylesheet" href="css/wishlist.css">
</head>

<body>
  <!-- Navbar & Footer injected by JS -->

  <main id="main-content" class="wishlist-page">
    <div class="container">
      
      <!-- WISHLIST HEADER -->
      <header class="wishlist-header">
        <span class="wishlist-header__subtitle">Exploration / Saved Pieces</span>
        <h1 class="wishlist-header__title">Wishlist</h1>
        <p class="wishlist-header__desc">Pieces you've chosen to keep close.</p>
      </header>

      <!-- EMPTY STATE (Hidden by default) -->
      <div id="wishlist-empty" class="wishlist-empty hidden">
        <p class="wishlist-empty__message">Your wishlist is currently empty.</p>
        <p class="wishlist-empty__desc">Explore the collection and save pieces that speak to you.</p>
        <a href="collection.html" class="btn btn-primary">Explore the Collection</a>
      </div>

      <!-- WISHLIST CONTENT LAYOUT -->
      <div id="wishlist-content" class="wishlist-content hidden">
        <div class="product-grid" id="wishlist-grid">
          <!-- Items injected by JS -->
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/data/products.js"></script>
  <script src="js/state/storage.js"></script>
  <script src="js/state/cart.js"></script>
  <script src="js/state/wishlist.js"></script>
  <script src="js/state/orders.js"></script>
  <script src="js/state/appointments.js"></script>
  
  <script src="js/utils.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>
  
  <!-- Page specific script -->
  <script src="js/wishlist-page.js"></script>
</body>
</html>
